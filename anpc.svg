      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="250" height="50" rx="8" fill="url(#bgAnpc)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Romanian Tricolor Accent on Left Edge -->
